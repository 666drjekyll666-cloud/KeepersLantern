name: Reproduce Keeper's Lantern 1.0.9

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/reproduce-1.0.9.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest

    steps:
      - name: Checkout accepted public source
        uses: actions/checkout@v4
        with:
          ref: 45a1bc175a456224a91acbf34be820e3271a449e

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore KeepersLantern.csproj --configfile nuget.config

      - name: Reproduce accepted binary identity
        shell: pwsh
        run: |
          dotnet build KeepersLantern.csproj -c Release --no-restore -p:SourceRevisionId=1ed29f48c33768d11e7dcf75cf5ea01a234c9369
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'bin/Release/KeepersLantern.dll' 'dist/KeepersLantern-1.0.9.dll'
          $hash = (Get-FileHash 'dist/KeepersLantern-1.0.9.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Reproduced SHA-256: $hash"
          $expected = '2c3a2ea5da5204153c00eaa0ba77c36f96a0977535837a450d2cbe22e4cef09a'
          if ($hash -ne $expected) {
            throw "Exact binary reproduction failed: expected $expected, got $hash"
          }

      - name: Upload exact accepted DLL
        uses: actions/upload-artifact@v4
        with:
          name: KeepersLantern-1.0.9-exact
          path: dist/KeepersLantern-1.0.9.dll
          if-no-files-found: error
          retention-days: 7
