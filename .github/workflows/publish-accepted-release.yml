name: Publish Accepted Release

on:
  push:
    branches:
      - main
    paths:
      - 'release/accepted.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-accepted-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read accepted release manifest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          manifest='release/accepted.json'
          for key in version tag title source_sha run_id artifact_name asset_name sha256 notes; do
            value="$(jq -r --arg key "$key" '.[$key]' "$manifest")"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "Missing release manifest field: $key" >&2
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; no publication work required."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact accepted artifact
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: release-asset
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.run_id }}

      - name: Verify accepted binary
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          asset="release-asset/${{ steps.release.outputs.asset_name }}"
          test -f "$asset"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          expected='${{ steps.release.outputs.sha256 }}'
          if [ "$actual" != "$expected" ]; then
            echo "SHA-256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_SHA256: ${{ steps.release.outputs.sha256 }}
          RELEASE_ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          asset="release-asset/$RELEASE_ASSET_NAME"

          cat > release-notes.md <<EOF
          $RELEASE_NOTES

          SHA-256: $RELEASE_SHA256
          EOF

          gh release create "$RELEASE_TAG" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SOURCE_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
